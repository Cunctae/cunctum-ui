name: Build and Publish CunctumUI to GitHub Pages

on:
  push:
    branches:
      - "main"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      # Build landing page → dist-landing/
      - run: npm run build-landing

      # Build Storybook → storybook-static/
      - run: npx storybook build --output-dir storybook-static
        env:
          STORYBOOK_BASE: /cunctum-ui/storybook/

      # Move Storybook into landing output as a subfolder
      - run: mv storybook-static dist-landing/storybook

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-landing

      - id: deployment
        uses: actions/deploy-pages@v4
